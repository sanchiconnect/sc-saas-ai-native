# ──────────────────────────────────────────────
# POLICY RAILS (compliance guard prompts to inject)
# ──────────────────────────────────────────────
policy_rails:
  - policy_id: POL-AUDIT-001
    applies_to: [MOD-DB-INIT, MOD-ING, MOD-EXT]
    description: "Every pipeline stage must write an immutable audit log entry before yielding to the next stage."

  - policy_id: POL-FRAUD-001
    applies_to: [MOD-EXT]
    description: "Bank detail fields in extraction output must be flagged HIGH_SENSITIVITY. No bank details written to standard application logs."

  - policy_id: POL-CONF-001
    applies_to: [MOD-EXT]
    description: "Confidence thresholds are configurable parameters — never hardcoded. Default values must be documented in config/."

  - policy_id: POL-READONLY-001
    applies_to: [MOD-ERP-SPIKE]
    description: "ERP integration is read-only in all phases. Spike must not write to or trigger actions in the ERP."

