# sprint-capacity.yaml — Sprint Capacity Plan
# SpecPod Framework v2.1.0 · Conductor Input
# Source: POD Lead (Michael Torres) · Generated: 2026-06-10

meta:
  sprint_id: SPRINT-001
  sprint_name: "Phase 1 — Ingestion, Extraction & ERP Spike"
  program_id: PRG-APIA-001
  sprint_start: "2026-06-10"
  sprint_end: "2026-06-13"
  working_days: 4
  planning_day: "2026-06-10"   # Monday — reserved for planning; no build dispatch

# ──────────────────────────────────────────────
# BUILDER ROSTER
# ──────────────────────────────────────────────
builders:
  - builder_id: BUILDER-1
    role: "Primary Builder"
    skill_affinity: [spec-flow, spec-api, spec-database]
    preferred_task_types:
      - "Code generation (module)"
      - "Database schema/migration"
      - "API endpoint generation"
      - "Spec decomposition"
    hours_per_day: 6.0
    available_days: [Tue, Wed, Thu]   # Monday = planning day
    total_hours: 18.0
    notes: >
      Primary builder for ingestion pipeline and database migrations.
      Highest context on the async Celery pipeline pattern.

  - builder_id: BUILDER-2
    role: "Secondary Builder"
    skill_affinity: [spec-uiux, trace-graph, policy-catalog]
    preferred_task_types:
      - "Test scenario generation"
      - "Compliance check"
      - "Traceability verification"
      - "Code generation (module)"
    hours_per_day: 6.0
    available_days: [Tue, Wed, Thu]
    total_hours: 18.0
    notes: >
      Secondary builder for extraction pipeline and compliance rail injection.
      Runs traceability verification before each wave advance.

# ──────────────────────────────────────────────
# CAPACITY SUMMARY
# ──────────────────────────────────────────────
capacity_summary:
  total_raw_builder_hours: 36.0        # 2 builders × 6h × 3 build days
  overhead_buffer_pct: 15              # Planning overhead, HITL gate waits, ad-hoc POD Lead syncs
  overhead_hours: 5.4
  net_available_builder_hours: 30.6
  erp_spike_hours: 12.0               # Priya Mehta (human) — tracked separately, not builder capacity
  net_build_hours: 30.6               # Available for MOD-ING + MOD-EXT + MOD-DB-INIT

# ──────────────────────────────────────────────
# WAVE ALLOCATION PLAN
# ──────────────────────────────────────────────
wave_allocation:
  wave_0:
    dispatch_day: "Tuesday AM"
    description: "Foundation — can start in parallel; no inter-task dependencies"
    planned_hours: 16.0
    tasks:
      - task_ref: T-001
        description: "Database schema migrations (Invoice, ExtractionResult, AuditLog, ManualReviewQueue)"
        builder: BUILDER-1
        estimated_hours: 4.0
        skill: spec-database

      - task_ref: T-002
        description: "Invoice Ingestion module — Microsoft Graph API polling, attachment classification, Celery queue"
        builder: BUILDER-1
        estimated_hours: 8.0
        skill: spec-flow

      - task_ref: T-003
        description: "Extraction pipeline scaffold — pdfplumber integration, field schema, confidence scoring framework"
        builder: BUILDER-2
        estimated_hours: 6.0
        skill: spec-flow

      - task_ref: T-004
        description: "Policy compliance rail injection — POL-AUDIT-001, POL-FRAUD-001, POL-CONF-001"
        builder: BUILDER-2
        estimated_hours: 2.0
        skill: policy-catalog

  wave_1:
    dispatch_day: "Wednesday AM (after Wave 0 TraceGraph verification)"
    description: "Extraction logic and queue routing — depends on T-001 and T-003 completion"
    planned_hours: 8.0
    tasks:
      - task_ref: T-005
        description: "Field extraction logic — all fields with per-field confidence thresholds applied"
        builder: BUILDER-1
        estimated_hours: 5.0
        skill: spec-flow
        depends_on: [T-001, T-003]

      - task_ref: T-006
        description: "Manual review queue routing — low-confidence invoices routed to MANUAL_REVIEW status"
        builder: BUILDER-2
        estimated_hours: 3.0
        skill: spec-flow
        depends_on: [T-003, T-005]

  wave_2:
    dispatch_day: "Thursday AM (after Wave 1 TraceGraph verification)"
    description: "Integration, end-to-end wire-up, and Gate-2 pre-check traceability"
    planned_hours: 5.6
    tasks:
      - task_ref: T-007
        description: "End-to-end pipeline wire-up — ingestion → extraction → audit log, integration test with 50 test invoices"
        builder: BUILDER-1
        estimated_hours: 4.0
        skill: spec-flow
        depends_on: [T-002, T-005, T-006]

      - task_ref: T-008
        description: "TraceGraph verification — Gate-2 pre-check traceability attestation"
        builder: BUILDER-2
        estimated_hours: 2.0
        skill: trace-graph
        depends_on: [T-007]

# ──────────────────────────────────────────────
# ERP SPIKE — TRACKED SEPARATELY
# ──────────────────────────────────────────────
erp_spike:
  owner: "Priya Mehta"
  type: "Human-led investigation"
  note: >
    Not dispatched to AI Builders. Priya Mehta leads the ERP spike directly.
    Conductor tracks spike deadline only; dispatch is not applicable.
  deadline: "2026-06-21"
  milestone_check: "2026-06-17"   # Mid-spike check-in with Michael Torres
  output: "artifacts/erp-spike-findings.md"

# ──────────────────────────────────────────────
# LOAD BALANCING CONSTRAINTS
# ──────────────────────────────────────────────
load_balancing:
  max_high_complexity_per_builder_per_wave: 1
  traceability_gate_before_wave_advance: true   # TraceGraph must run before each wave
  decision_logging_mode: "side-channel"         # Does not consume builder capacity
  compliance_injection_mode: "cluster-prompt"   # Injected into task prompts, not separate tasks

# ──────────────────────────────────────────────
# RISK FLAGS
# ──────────────────────────────────────────────
risk_flags:
  - id: RISK-CAP-001
    description: >
      Sprint is 4 working days (Monday planning + 3 build days). Wave 2 completion
      on Thursday leaves no buffer for rework. If T-007 integration testing surfaces
      extraction bugs, T-008 traceability may slip to Friday or Sprint-002.
    severity: MEDIUM
    mitigation: >
      T-005 and T-006 are scheduled for Wednesday; Thursday is reserved for integration
      and traceability. POD Lead should review wave 1 completion by Wednesday EOD and
      make a go/no-go call on T-007 scope.

  - id: RISK-CAP-002
    description: >
      ERP spike deadline (2026-06-21) falls in Sprint-002. If spike findings surface
      critical blockers, Phase 3 scope and Sprint-002+ planning must be renegotiated.
    severity: HIGH
    mitigation: >
      Mid-spike check-in on 2026-06-17 (Priya Mehta + Michael Torres).
      CFO office informed proactively if timeline must shift (per program.md Risk Register).

# ──────────────────────────────────────────────
# COMPLETION FORECAST INPUTS (for Conductor)
# ──────────────────────────────────────────────
forecast_inputs:
  total_tasks: 8
  average_task_duration_hours: 4.0
  net_builder_hours_available: 30.6
  estimated_completion_day: "Thursday EOD"
  confidence: MEDIUM   # 4-day sprint with moderate integration risk in T-007
