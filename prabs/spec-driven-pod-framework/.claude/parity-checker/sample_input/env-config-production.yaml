# SpecPod ParityChecker — Environment Config
# Environment: production
# Sprint: CS-CHAT-S07
# Generated: 2025-09-05T14:30:00Z
# IMPORTANT: Do not store secret values — names and presence only

environment: production
generated_at: "2025-09-05T14:30:00Z"
sprint_id: CS-CHAT-S07

runtime:
  orchestration: kubernetes-1.28
  base_image: node:20.11.0-alpine
  cpu: "2vCPU"
  memory: "4GB"
  region: us-east-1
  autoscaling:
    min_replicas: 2
    max_replicas: 10

application:
  runtime_name: node
  runtime_version: "20.11.0"
  lockfile_hash: "sha256:a3f9c821..."
  build_image: "myapp-build:2025-09-04-sha-abc123"

database:
  engine: postgresql
  version: "16.1"
  latest_migration_id: "0044"  # DRIFT: staging=0045, production=0044
  read_replicas: 2
  connection_pool_min: 5
  connection_pool_max: 5
  cache:
    engine: redis
    version: "7.2.3"
    node_type: cache.r6g.large

external_services:
  - name: Mailgun
    sdk_version: "5.0.1"
    endpoint_type: live
    auth_method: api_key
  - name: Firebase FCM
    sdk_version: "12.3.0"
    endpoint_type: live
    auth_method: service_account
  - name: Auth0
    sdk_version: "4.1.0"
    endpoint_type: live
    auth_method: oauth

feature_flags:
  notifications_v2: false  # DRIFT: staging=true, production=false (in-sprint feature!)
  legacy_auth: false
  payments_v3: false
  debug_panel: false
  in_app_badge: false

environment_variables:
  present:
    - DATABASE_URL
    - DATABASE_READ_REPLICA_URL
    - REDIS_URL
    - MAILGUN_API_KEY
    - MAILGUN_DOMAIN
    - FIREBASE_PROJECT_ID
    - FIREBASE_SERVICE_ACCOUNT_KEY
    - AUTH0_DOMAIN
    - AUTH0_CLIENT_ID
    - AUTH0_CLIENT_SECRET
    - JWT_SECRET
    - APP_SECRET_KEY
    - LOG_LEVEL
    - NEW_RELIC_LICENSE_KEY
  missing_vs_production: []

monitoring:
  log_level: INFO
  apm_agent: newrelic
  apm_version: "11.0.0"
  error_tracking: present
  health_check_path: /health

network:
  tls_provider: aws-acm
  tls_expiry: "2025-12-15"
  cors_origins:
    - "https://app.myapp.com"
  waf_enabled: true
