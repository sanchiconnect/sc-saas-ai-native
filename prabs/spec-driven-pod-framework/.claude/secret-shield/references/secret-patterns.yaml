# Secret Pattern Library — SecretShield
# Format: YAML pattern definitions for regex-based credential detection
# Version: 2.1.0

patterns:

  # ── Anthropic ─────────────────────────────────────────────────────────────
  - id: ANTHROPIC_API_KEY
    description: "Anthropic API key (Claude)"
    regex: "sk-ant-api[0-9]{2}-[A-Za-z0-9_\\-]{86,}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:ANTHROPIC_API_KEY]"

  # ── OpenAI ────────────────────────────────────────────────────────────────
  - id: OPENAI_API_KEY_LEGACY
    description: "OpenAI API key (legacy sk- format)"
    regex: "sk-[A-Za-z0-9]{48}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:OPENAI_API_KEY]"

  - id: OPENAI_API_KEY_PROJECT
    description: "OpenAI project API key"
    regex: "sk-proj-[A-Za-z0-9_\\-]{40,}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:OPENAI_API_KEY]"

  - id: OPENAI_ORG_ID
    description: "OpenAI organisation ID"
    regex: "org-[A-Za-z0-9]{24}"
    severity: MEDIUM
    action: REDACT
    placeholder: "[REDACTED:OPENAI_ORG_ID]"

  # ── AWS ───────────────────────────────────────────────────────────────────
  - id: AWS_ACCESS_KEY_ID
    description: "AWS access key ID"
    regex: "(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])"
    severity: HIGH
    action: BLOCK_AND_ALERT
    placeholder: "[REDACTED:AWS_ACCESS_KEY]"

  - id: AWS_SECRET_ACCESS_KEY
    description: "AWS secret access key (follows AKIA key)"
    regex: "(?i)aws_secret_access_key\\s*[=:]\\s*[\"']?[A-Za-z0-9/+]{40}[\"']?"
    severity: HIGH
    action: BLOCK_AND_ALERT
    placeholder: "[REDACTED:AWS_SECRET_KEY]"

  # ── Database Connection Strings ───────────────────────────────────────────
  - id: POSTGRESQL_URL
    description: "PostgreSQL connection string with credentials"
    regex: "postgresql(\\+asyncpg)?://[^:]+:[^@]+@[^/]+"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:DB_CONNECTION_STRING]"

  - id: MYSQL_URL
    description: "MySQL connection string with credentials"
    regex: "mysql(\\+pymysql)?://[^:]+:[^@]+@[^/]+"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:DB_CONNECTION_STRING]"

  # ── Authentication Tokens ────────────────────────────────────────────────
  - id: JWT_TOKEN
    description: "JSON Web Token"
    regex: "eyJ[A-Za-z0-9_\\-]{10,}\\.eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]+"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:JWT_TOKEN]"

  - id: BEARER_TOKEN
    description: "HTTP Bearer token in header format"
    regex: "(?i)bearer\\s+[A-Za-z0-9\\-._~+/]{20,}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:BEARER_TOKEN]"

  # ── Source Control ────────────────────────────────────────────────────────
  - id: GITHUB_TOKEN
    description: "GitHub personal access token or app token"
    regex: "gh[pousr]_[A-Za-z0-9]{36,}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:GITHUB_TOKEN]"

  - id: GITLAB_TOKEN
    description: "GitLab personal access token"
    regex: "glpat-[A-Za-z0-9\\-_]{20}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:GITLAB_TOKEN]"

  # ── Messaging & Collaboration ─────────────────────────────────────────────
  - id: SLACK_TOKEN
    description: "Slack bot or user token"
    regex: "xox[baprs]-[0-9A-Za-z\\-]{10,}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:SLACK_TOKEN]"

  # ── Cloud & SaaS ──────────────────────────────────────────────────────────
  - id: GOOGLE_API_KEY
    description: "Google Cloud API key"
    regex: "AIza[0-9A-Za-z\\-_]{35}"
    severity: HIGH
    action: REDACT_AND_ALERT
    placeholder: "[REDACTED:GOOGLE_API_KEY]"

  - id: STRIPE_KEY
    description: "Stripe live secret key"
    regex: "sk_live_[A-Za-z0-9]{24,}"
    severity: HIGH
    action: BLOCK_AND_ALERT
    placeholder: "[REDACTED:STRIPE_LIVE_KEY]"

  - id: STRIPE_TEST_KEY
    description: "Stripe test secret key"
    regex: "sk_test_[A-Za-z0-9]{24,}"
    severity: MEDIUM
    action: REDACT
    placeholder: "[REDACTED:STRIPE_TEST_KEY]"

  # ── Private Keys ──────────────────────────────────────────────────────────
  - id: PRIVATE_KEY_BLOCK
    description: "PEM private key block"
    regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    severity: HIGH
    action: BLOCK_AND_ALERT
    placeholder: "[REDACTED:PRIVATE_KEY_BLOCK]"

  # ── Generic Patterns ─────────────────────────────────────────────────────
  - id: GENERIC_SECRET_ASSIGNMENT
    description: "Generic secret/password assignment in config"
    regex: "(?i)(password|passwd|secret|api_key|apikey|auth_token|access_token|private_key)\\s*[=:]\\s*[\"']?(?!\\[REDACTED)[^\\s\"']{8,}[\"']?"
    severity: MEDIUM
    action: REDACT
    placeholder: "[REDACTED:GENERIC_SECRET]"

# ── Entropy Thresholds ──────────────────────────────────────────────────────
entropy_config:
  min_length_for_analysis: 20
  high_entropy_threshold: 3.5    # bits per character (Shannon entropy)
  action_on_high_entropy: REDACT_POSSIBLE
  placeholder: "[REDACTED:POSSIBLE_SECRET_HIGH_ENTROPY]"
