# Secret Whitelist — SecretShield
# Strings and patterns that match secret regex but are known non-secrets.
# POD Lead: update this file when SecretShield produces false positives.
# Version: 2.1.0

whitelist:

  # ── Stripe Test Keys ──────────────────────────────────────────────────────
  - id: WL-001
    type: prefix
    value: "sk_test_"
    # Override: Stripe test keys are not production secrets.
    # Still redacted at MEDIUM severity — do not pass test keys to external LLMs.
    # Remove this entry if you never want test keys to pass through unblocked.
    action_override: LOG_ONLY

  # ── Documentation Placeholders ────────────────────────────────────────────
  - id: WL-002
    type: exact
    value: "your-api-key-here"
    reason: "README/documentation placeholder"

  - id: WL-003
    type: exact
    value: "sk-your-openai-key"
    reason: "Setup guide placeholder"

  - id: WL-004
    type: exact
    value: "REPLACE_WITH_YOUR_API_KEY"
    reason: "Template placeholder"

  - id: WL-005
    type: pattern
    regex: "(?i)example[_\\-]?(api[_\\-]?key|token|secret)"
    reason: "Example/demo key naming pattern"

  # ── Test/Mock Values in Test Files ────────────────────────────────────────
  - id: WL-006
    type: path_pattern
    path_regex: "tests?/.*\\.(py|ts|js)$"
    value_pattern: "fake[_\\-]?.*key|mock[_\\-]?.*token|test[_\\-]?.*secret"
    reason: "Test file mock credentials"

  # ── High-Entropy False Positives ──────────────────────────────────────────
  - id: WL-007
    type: pattern
    regex: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    reason: "UUID v4 — high entropy but not a secret"

  - id: WL-008
    type: pattern
    regex: "[0-9a-f]{64}"
    reason: "SHA-256 hash — high entropy but typically a content hash, not a credential"
    note: "Review context — a 64-char hex in a .env file IS suspicious; in source code it may be a hash constant"
