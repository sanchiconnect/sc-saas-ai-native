# ── MAINTENANCE INSTRUCTIONS ──────────────────────────────────
# 1. TransformIQ rescores ALL active entries every Monday.
#    Update baseline_score with the TransformIQ output after each sprint.
# 2. When an opportunity is built, set status: DELIVERED and record
#    actual value in prior_sprint_actuals for ValueModeler calibration.
# 3. Never assign an id that has been previously used (including archived).
#    Next available ID: OPP-021
# 4. The scoring_breakdown fields are for TransformIQ weighting inputs.
#    Keep them honest — inflated scores degrade prioritisation quality.
