# ============================================================
# OPPORTUNITY CATALOGUE
# SpecPod Framework v2.1.0 · TransformIQ + ValueModeler Reference
# ============================================================
# PURPOSE
# Master AI opportunity backlog. TransformIQ rescores entries
# every Monday sprint planning session. Never delete entries —
# set status: ARCHIVED when an opportunity is no longer relevant.
#
# SCORING DIMENSIONS (each 0–10, combined by TransformIQ weights)
#   strategic_fit     — alignment with current programme objectives
#   speed_to_value    — how quickly value is realised post-deploy
#   risk_inverse      — 10 = low risk, 0 = high risk
#   user_impact       — breadth × depth of user benefit
#   tech_debt_reduction — code/process complexity removed
#
# EFFORT TIERS
#   XS  ≤ 2h   |  S  2–4h  |  M  4–8h  |  L  8–16h  |  XL  > 16h
# ============================================================

meta:
  version: "2.1.0"
  last_updated: "2026-05-27"
  total_active: 20
  total_archived: 3
  scoring_model: "weighted_composite_v2"
  next_rescore_sprint: "SPRINT-002"

# ── SCORING REFERENCE ────────────────────────────────────────
scoring_reference:
  - range: "8.0–10.0"
    classification: HIGH_VALUE
    action: "Prioritise for upcoming sprint"
  - range: "6.0–7.9"
    classification: MEDIUM_VALUE
    action: "Candidate for sprint inclusion"
  - range: "4.0–5.9"
    classification: LOW_VALUE
    action: "Hold in backlog — revisit next quarter"
  - range: "0.0–3.9"
    classification: DEPRIORITISED
    action: "Revisit during quarterly backlog grooming"

